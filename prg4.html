<!DOCTYPE html>
<html>
<head>
    <title>Ganesh Chaturthi</title>

    <style>
        body {
            background-color: #fff3e0;
            text-align: center;
            font-family: Arial;
        }

        h1 {
            color: #e65100;
            background-color: #ffcc80;
            padding: 20px;
        }

        .box {
            background-color: white;
            width: 70%;
            margin: 30px auto;
            padding: 25px;
            border: 3px solid #ff9800;
            border-radius: 15px;
        }

        h2 {
            color: #d84315;
        }

        p {
            font-size: 18px;
            color: #5d4037;
        }

        button {
            background-color: #e65100;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
        }

        footer {
            background-color: #ff9800;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <h1>🙏 Ganesh Chaturthi 🙏</h1>

    <div class="box">

        <h2>🌺 Welcome Lord Ganesha 🌺</h2>

        <h1>🐘</h1>

        <p>
            Ganpati Bappa Morya!
        </p>

        <p>
            May Lord Ganesha bless us with
            happiness, success and prosperity.
        </p>

        <p>🪔 🌸 🍬 🌸 🪔</p>
       
        <p> special wishes for Hari Chandana and Varshitha</p>

        <button>Happy Ganesh Chaturthi</button>

    </div>

    <footer>
        🌼 Ganpati Bappa Morya 🌼
    </footer>

</body>
</html>
